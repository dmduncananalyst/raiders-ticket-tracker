<!doctype html><html lang="en"><meta charset="utf-8"><title>Live tracker check</title><style>body{font:18px Arial}iframe{width:390px;height:844px}pre{white-space:pre-wrap}</style><h1>Actual local tracker check</h1><pre id="results">Waiting for the real browser helper…</pre><iframe src="../index.html" title="Live tracker at phone width"></iframe><script>
const frame=document.querySelector('iframe'),out=document.querySelector('#results');
if(new URLSearchParams(location.search).has('visual')){document.querySelector('h1').hidden=true;out.hidden=true;document.body.style.cssText='margin:0;background:#101112';frame.style.cssText='display:block;width:390px;height:2200px;border:0';}
const timer=setInterval(()=>{const d=frame.contentDocument;if(!d||d.querySelectorAll('.game').length!==5)return;const cards=[...d.querySelectorAll('.game')];if(cards.some(c=>c.querySelector('[data-own]').textContent.includes('Checking')))return;clearInterval(timer);const lines=cards.map(c=>({game:c.querySelector('h2').textContent,own:c.querySelector('[data-own]').textContent,others:c.querySelector('[data-others]').textContent,decision:c.querySelector('[data-decision]').textContent}));out.textContent=JSON.stringify({games:cards.length,phoneWidth:d.documentElement.clientWidth,noHorizontalOverflow:d.documentElement.scrollWidth===d.documentElement.clientWidth,results:lines},null,2);document.title='DONE live tracker check';},500);
</script></html>
